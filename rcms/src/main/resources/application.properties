# Import .env configuration from root or working directory
spring.config.import=optional:file:./.env,optional:file:../.env

# Server Port
server.port=${SERVER_PORT:8080}

# Application Name
spring.application.name=Research Conference Management System

# ============================================================
# Database Configuration (Neon PostgreSQL Primary)
# Configured via environment variables (DATABASE_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, DB_DIALECT)
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-shy-surf-az57lzlo-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_VnHuB9k4EopK}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA & Hibernate Settings
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Upload Directory
app.upload-dir=${UPLOAD_DIR:uploads/papers}
