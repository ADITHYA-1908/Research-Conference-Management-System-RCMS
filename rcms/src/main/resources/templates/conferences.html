<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head('Conferences Directory')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container-xl my-4">
    <!-- Mobile Back Navigation -->
    <div class="d-md-none mb-3">
        <a href="javascript:handleMobileBack()" class="btn-mobile-back">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="page-title"><i class="bi bi-calendar3 text-primary me-2"></i> Academic Conferences Directory</h1>
            <p class="small-text mb-0">Official directory of upcoming and active academic conferences.</p>
        </div>
        <div>
            <input type="text" class="form-control form-control-sm table-search-input" data-table-target="conferencesTable" placeholder="Filter conferences by title/location..." style="width: 250px;">
        </div>
    </div>

    <div class="card-univ">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table id="conferencesTable" class="table table-univ align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Conference Title &amp; Theme</th>
                            <th>Location / Venue</th>
                            <th>Conference Dates</th>
                            <th>Submission Deadline</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(conferences)}">
                            <td colspan="7" class="text-center text-muted py-3">No conferences found in directory.</td>
                        </tr>
                        <tr th:each="conf : ${conferences}">
                            <td class="fw-bold text-muted">#<span th:text="${conf.id}">1</span></td>
                            <td>
                                <strong class="text-primary" th:text="${conf.title}">Title</strong>
                                <div class="small-text" th:text="${conf.theme}">Theme</div>
                            </td>
                            <td class="small-text" th:text="${conf.location}">Venue</td>
                            <td class="small-text" th:text="${conf.startDate} + ' to ' + ${conf.endDate}">Dates</td>
                            <td><span class="badge bg-light text-dark border" th:text="${conf.submissionDeadline}">Deadline</span></td>
                            <td>
                                <span th:class="'badge ' + (${conf.status == 'OPEN'} ? 'bg-success' : (${conf.status == 'UPCOMING'} ? 'bg-primary' : 'bg-secondary'))"
                                      th:text="${conf.status}">STATUS</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/conferences/{id}(id=${conf.id})}" class="btn btn-outline-primary btn-sm">
                                    View Details <i class="bi bi-chevron-right ms-1"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
