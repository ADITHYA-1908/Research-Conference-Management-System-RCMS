<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head('Manage Users')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container-xl my-4">
    <!-- Mobile Back Navigation -->
    <div class="d-md-none mb-3">
        <a th:href="@{/admin/dashboard}" class="btn-mobile-back">
            <i class="bi bi-arrow-left"></i> Back to Admin Portal
        </a>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
        <div>
            <h1 class="page-title"><i class="bi bi-people-fill text-primary me-2"></i>User Directory &amp; Role Management</h1>
            <p class="small-text mb-0">View all registered users and update their system roles.</p>
        </div>
        <div class="d-flex gap-2 w-100 w-md-auto">
            <input type="text" class="form-control form-control-sm table-search-input" data-table-target="usersTable" placeholder="Filter users..." style="max-width: 220px;">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm text-nowrap"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
        </div>
    </div>

    <div th:if="${param.updated}" class="alert alert-success py-2 small-text">User role updated successfully!</div>

    <div class="card-univ">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table id="usersTable" class="table table-univ align-middle mb-0">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Institution</th>
                            <th>Current Role</th>
                            <th class="text-end">Update Role</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center text-muted py-3">No users found.</td>
                        </tr>
                        <tr th:each="u : ${users}">
                            <td class="fw-bold text-muted" th:text="${'#' + u.id}">#1</td>
                            <td class="fw-semibold" th:text="${u.name}">User Name</td>
                            <td th:text="${u.email}">email@domain.com</td>
                            <td th:text="${u.institution != null ? u.institution : 'N/A'}">Institution</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.role == 'ADMIN' ? 'bg-danger' : (u.role == 'REVIEWER' ? 'bg-warning text-dark' : 'bg-primary')}"
                                      th:text="${u.role}">ROLE</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/user/{id}/role(id=${u.id})}" method="post" class="d-inline-flex gap-1 align-items-center">
                                    <select name="role" class="form-select form-select-sm" style="width: auto;">
                                        <option value="AUTHOR" th:selected="${u.role == 'AUTHOR'}">AUTHOR</option>
                                        <option value="REVIEWER" th:selected="${u.role == 'REVIEWER'}">REVIEWER</option>
                                        <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-check-lg"></i> Update</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
