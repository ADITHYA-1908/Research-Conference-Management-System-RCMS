<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head(${conference.id != null} ? 'Edit Conference' : 'Add Conference')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container-xl my-4">
    <div class="mb-3">
        <a th:href="@{/admin/conferences}" class="btn-mobile-back">
            <i class="bi bi-arrow-left"></i> Back to Conferences List
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-univ p-4">
                <h2 class="section-title text-primary mb-3">
                    <i class="bi bi-pencil-square me-2"></i>
                    <span th:text="${conference.id != null} ? 'Edit Conference Specification' : 'Add New Academic Conference'">Form</span>
                </h2>
                <hr class="my-3">

                <form th:action="@{/admin/conference/save}" th:object="${conference}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger py-2 small-text mb-3">
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Validation Error</li>
                        </ul>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Conference Title *</label>
                        <input type="text" class="form-control" th:field="*{title}" placeholder="e.g. International Conference on Computer Science" required>
                        <div class="text-danger small-text mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Conference Theme</label>
                        <input type="text" class="form-control" th:field="*{theme}" placeholder="e.g. Intelligent & Distributed Systems">
                        <div class="text-danger small-text mt-1" th:if="${#fields.hasErrors('theme')}" th:errors="*{theme}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description &amp; Call for Papers</label>
                        <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Detailed objectives and scope..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Venue / Location</label>
                            <input type="text" class="form-control" th:field="*{location}" placeholder="Main Campus Auditorium">
                            <div class="text-danger small-text mt-1" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="OPEN">OPEN</option>
                                <option value="UPCOMING">UPCOMING</option>
                                <option value="CLOSED">CLOSED</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Start Date *</label>
                            <input type="date" class="form-control" th:field="*{startDate}" required>
                            <div class="text-danger small-text mt-1" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">End Date *</label>
                            <input type="date" class="form-control" th:field="*{endDate}" required>
                            <div class="text-danger small-text mt-1" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Submission Deadline *</label>
                            <input type="date" class="form-control" th:field="*{submissionDeadline}" required>
                            <div class="text-danger small-text mt-1" th:if="${#fields.hasErrors('submissionDeadline')}" th:errors="*{submissionDeadline}"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-3">
                        <a th:href="@{/admin/conferences}" class="btn btn-secondary btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="bi bi-save me-1"></i> Save Conference
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
