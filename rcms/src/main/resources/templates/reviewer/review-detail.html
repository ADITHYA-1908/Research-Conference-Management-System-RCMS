<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head('Completed Review Detail')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container-xl my-4">
    <div class="mb-3">
        <a th:href="@{/reviewer/papers}" class="btn-mobile-back">
            <i class="bi bi-arrow-left"></i> Back to Assigned Papers
        </a>
    </div>

    <div class="card-univ p-4">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-success">COMPLETED EVALUATION</span>
            <span class="small-text">Reviewed: <span th:text="${#temporals.format(review.reviewedAt, 'yyyy-MM-dd HH:mm')}">Date</span></span>
        </div>

        <h1 class="page-title text-primary mb-2" th:text="${review.paper.title}">Paper Title</h1>
        <p class="small-text mb-3">
            <strong>Conference:</strong> <span th:text="${review.paper.conference.title}">Conference</span>
        </p>

        <hr class="my-3">

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="p-3 bg-light border rounded">
                    <div class="stat-label mb-1">Score Rating</div>
                    <strong class="fs-5 text-primary" th:text="${review.score} + ' / 10'">8 / 10</strong>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 bg-light border rounded">
                    <div class="stat-label mb-1">Recommendation</div>
                    <strong class="fs-5 text-dark" th:text="${review.recommendation}">ACCEPT</strong>
                </div>
            </div>
        </div>

        <div class="stat-label mb-1">Detailed Reviewer Comments</div>
        <div class="p-3 bg-light border rounded small-text text-secondary leading-relaxed" th:text="${review.comments}">Comments...</div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
